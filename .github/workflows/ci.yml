name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: before checkout 
        run:
          ls -la
          python3 --version

      - name: Download my code
        uses: actions/checkout@v7

      - name: After checkout
        run:
          ls -la
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend packages
        run: |
          python -version
          cd backend
          pip install -r requirements-dev.txt
          pip list

           
              